[package]
name = "restrace"
description = "Run a command under strace and emit the parsed system calls"
version = "0.1.0"
edition = "2024"
authors = ["Leandro Lisboa Penz <lpenz@lpenz.org>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/lpenz/restrace"
repository = "https://github.com/lpenz/restrace"
categories = ["command-line-utilities"]
keywords = ["command-line"]

[[bin]]
name = "restrace"
path = "src/bin/restrace.rs"
required-features = ["tokio"]

[dependencies]
clap = { version = "4.6.2", features = ["derive"] }
color-eyre = "0.6.5"
libc = "0.2"
tokio = { version = "1.53.0", features = ["fs", "io-std", "io-util", "macros", "process", "rt"] }
tokio-stream = { version = "0.1.19", optional = true }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[features]
default = ["tokio"]
tokio = ["dep:tokio-stream"]
